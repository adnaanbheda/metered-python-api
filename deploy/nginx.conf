# Docker DNS returns one A record per api replica; nginx round-robins across them.
upstream api {
    server api:8000;
    # Idle connections each nginx worker keeps open to replicas for reuse.
    keepalive 64;
}

server {
    listen 80;
    # A log write per request costs CPU nginx shares with the replicas under load.
    access_log off;

    location / {
        proxy_pass http://api;
        # Upstream keepalive needs HTTP/1.1; nginx defaults to 1.0 and sends "Connection: close".
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Which replica answered; integration tests check load actually spreads.
        add_header X-Upstream $upstream_addr always;
    }
}
