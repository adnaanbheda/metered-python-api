# Docker DNS returns one A record per api replica; nginx round-robins across them.
upstream api {
    server api:8000;
}

server {
    listen 80;

    location / {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Which replica answered; integration tests check load actually spreads.
        add_header X-Upstream $upstream_addr always;
    }
}
