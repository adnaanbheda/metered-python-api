[project]
name = "api-metred-quota"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Adnaan Bheda", email = "adnaan.bheda@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "granian[reload]>=2.8.7",
    "redis[hiredis]>=8.1.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
api-metred-quota = "main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]

[dependency-groups]
dev = [
    "fakeredis[lua]>=2.40.0",
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "pyyaml>=6.0.3",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts", ".", "tests"]
asyncio_mode = "auto"
markers = ["integration: spins up compose.yaml in Docker (run with -m integration)"]
addopts = "-m 'not integration'"

[tool.ty.environment]
extra-paths = ["src", "scripts"]


[tool.ruff]
target-version = "py313"
src = ["src", "scripts", "tests", "."]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["E501"]  # line length is the formatter's job

[tool.uv]
package = false
